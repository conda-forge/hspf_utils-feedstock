schema_version: 1

context:
  name: hspf_utils
  version: "6.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: e1e82c960b99e18149ff0f0a1f0174251626421df7b519600b547b6154dbebbf

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps
  python:
    entry_points:
      - hspf_utils = hspf_utils.hspf_utils:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=3.10
    - cltoolbox >2.0.0
    - dateparser
    - hspfbintoolbox >=9.0.0
    - numpy
    - odfpy >=1.4.1
    - openpyxl >=3.1.5
    - pandas
    - pint
    - pint-pandas
    - pydantic
    - python-calamine >=0.3.0
    - pyxlsb >=1.0.10
    - scipy
    - tabulate
    - toolbox_utils
    - typing-extensions
    - xlrd >=2.0.1
    - xlsxwriter >=3.2.0

tests:
  - python:
      imports:
        - hspf_utils
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - hspf_utils --help

about:
  summary: Command line script and Python library to develop water balance from HSPF models
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/hspf-utils/

extra:
  recipe-maintainers:
    - timcera
