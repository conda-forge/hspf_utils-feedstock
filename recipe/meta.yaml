{% set name = "hspf_utils" %}
{% set version = "6.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hspf_utils-{{ version }}.tar.gz
  sha256: e1e82c960b99e18149ff0f0a1f0174251626421df7b519600b547b6154dbebbf

build:
  entry_points:
    - hspf_utils = hspf_utils.hspf_utils:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - pandas
    - toolbox_utils
    - cltoolbox >1.1.0
    - hspfbintoolbox >=9.0.0,<10.0.0

test:
  imports:
    - hspf_utils
  commands:
    - pip check
    - hspf_utils --help
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Command line script and Python library to develop water balance from HSPF models
  home: https://pypi.org/project/hspf-utils/
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
